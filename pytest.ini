[pytest]
testpaths = tests
addopts = -ra --strict-markers --strict-config
xfail_strict = true
# Keep temporary directories only for failed tests.
tmp_path_retention_policy = failed
markers =
    live: calls real external services; skipped unless RUN_LIVE_TESTS=1
    characterizes_bug(phase): pins current buggy behaviour; update when that phase (B1 or B5) fixes it
